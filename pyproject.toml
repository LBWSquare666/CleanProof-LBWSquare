[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanproof"
version = "1.0.0"
description = "CleanProof: a physical AI software system that enables various robot platforms to clean intelligently"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "openai>=1.40",
  "httpx>=0.27",
  "pillow>=10",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
sim = ["mujoco>=3.2"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
desktop = ["pywebview>=5"]
robot = ["ur_rtde>=1.5"]
dev = ["pytest>=8"]

[project.scripts]
cleanproof = "cleanproof.launcher:main"

[project.urls]
Homepage = "https://github.com/LBWSquare666/CleanProof-LBWSquare"

[tool.setuptools.packages.find]
include = ["cleanproof*"]

[tool.setuptools.package-data]
cleanproof = ["agent/prompts/*.md", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "render: needs an OpenGL context (MUJOCO_GL=egl on servers, glfw with a display)",
  "network: calls a real remote API",
]
