<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600,initial-scale=1">
<title>CleanProof</title>
<!-- CleanProof operator software (cleanproof/ui/operator.py). Logical size 1600 x 900: the upper 746 is desktop and window, the lower 154 is left for video subtitles.
     First-run wizard (Robot → Connect → Models → Site, a small Bambu Studio style window that leads into the main UI); main UI: Jobs · Robots · Sites · Reports · Settings · Logs.
     All data comes from the API (real configs, real run records).
     All screen state is set deterministically by setView(v) (called frame by frame when recording); in local live mode the page polls the backend itself and buttons call the API directly.
     All fades are computed from parameters in v, with no CSS transitions (CSS transitions are not controllable in frame-by-frame screenshots). -->
<style>
@font-face{font-family:Manrope;font-weight:400;src:url(/fonts/manrope/Manrope-Regular.ttf)}
@font-face{font-family:Manrope;font-weight:600;src:url(/fonts/manrope/Manrope-SemiBold.ttf)}
:root{--paper:#f7f5f0;--card:#fff;--ink:#1d2433;--muted:#6b7280;--faint:#9aa1ad;--line:#e4e1da;--sub:#f4f2ed;
--clean:#0f766e;--clean-bg:#e3f2ef;--res:#d14343;--res-bg:#fbe9e7;--amber:#c26a12;--amber-bg:#fdf0e1;--nemo:#4f3fc8;--nemo-bg:#ece9fb;
--cos:#1d4ed8;--cos-bg:#e6edfc;--slate:#475569;--slate-bg:#eef0f3;
/* spacing follows the golden ratio: 8 · 13 · 21 · 34 */
--g0:8px;--g1:13px;--g2:21px;--g3:34px}
*{box-sizing:border-box}
html,body{margin:0;width:1600px;height:900px;overflow:hidden;background:var(--paper);color:var(--ink);font:400 14px/1.4 Manrope,system-ui,sans-serif}
#desk{position:absolute;left:0;top:0;width:1600px;height:746px;background:linear-gradient(160deg,#efece6,#e5e2da)}
#band{position:absolute;left:0;top:746px;width:1600px;height:154px;background:var(--paper)}
.win{position:absolute;left:16px;top:14px;width:1568px;height:718px;background:#fff;border:1px solid #d9d5cc;border-radius:14px;
  box-shadow:0 18px 50px rgba(29,36,51,.14),0 2px 6px rgba(29,36,51,.06);overflow:hidden}
.tbar{height:44px;display:flex;align-items:center;gap:var(--g1);padding:0 var(--g2);border-bottom:1px solid var(--line);background:#fbfaf8}
.dots{display:flex;gap:7px;margin-right:4px}.dots i{width:11px;height:11px;border-radius:50%;background:#d8d4cc;display:block}
.logo{width:22px;height:22px;border-radius:6px;flex:none;background:var(--clean) url(/brand/cleanproof_app.svg) center/106.667% no-repeat}
.ttl{font-weight:600;font-size:15px}
.sitechip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:4px 12px;font-weight:600;font-size:13px;background:#fff}
.sitechip i{width:8px;height:8px;border-radius:50%;background:var(--clean)}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--clean-bg);border-color:#b7dcd6;color:var(--clean)}
.pill.run{background:var(--amber-bg);border-color:#f0d3ad;color:var(--amber)}
.pill.bad{background:var(--res-bg);border-color:#f1c2bd;color:var(--res)}
.pill.staff{background:var(--slate-bg);border-color:#d5dae1;color:var(--slate)}
.user{width:28px;height:28px;border-radius:50%;background:var(--slate-bg);color:var(--slate);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
#body{position:absolute;left:0;top:44px;right:0;bottom:0;display:flex}
#nav{width:196px;flex:none;border-right:1px solid var(--line);background:#fbfaf8;padding:var(--g2) var(--g1)}
.nv{display:flex;align-items:center;gap:var(--g1);padding:9px 12px;border-radius:10px;font-weight:600;color:var(--muted);margin-bottom:4px}
.nv svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nv.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.07)}.nv.on svg{stroke:var(--clean)}
.nv.hover{background:#f3f1ec;color:var(--ink)}
.nvsep{height:1px;background:var(--line);margin:var(--g1) 6px}
#content{flex:1;position:relative;min-width:0}
.page{position:absolute;inset:0;padding:var(--g2) var(--g3) var(--g2) var(--g3);display:none}
.page.on{display:block}
.ph{display:flex;align-items:flex-end;gap:var(--g1);margin-bottom:var(--g2)}
.ph .h1{font-size:22px;font-weight:600;letter-spacing:-.2px}.ph .sub{color:var(--muted);font-size:13px;margin-top:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
h3{margin:0 0 var(--g0);font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:600}
button{font:600 14px Manrope,sans-serif;padding:8px 18px;border-radius:10px;border:1.5px solid var(--clean);background:var(--clean);color:#fff;cursor:pointer;white-space:nowrap}
button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
button.danger{background:#fff;color:var(--res);border-color:#efb7b0}
button.hover{filter:brightness(1.07);box-shadow:0 0 0 4px rgba(15,118,110,.14)}
button.ghost.hover,button.danger.hover{box-shadow:0 0 0 4px rgba(29,36,51,.06);filter:none;background:#faf9f6}
button.press{transform:scale(.96)}
button[disabled]{opacity:.4;cursor:default}
.mono{font-family:"DejaVu Sans Mono",ui-monospace,monospace;font-size:12px}
.muted{color:var(--muted)}
/* status dot */
.sd{width:22px;height:22px;border-radius:50%;border:1.5px solid #cfcac0;flex:none;position:relative;background:#fff}
.sd.ok{background:var(--clean);border-color:var(--clean)}
.sd.ok.fb{background:var(--amber);border-color:var(--amber)}
.sd.ok:after{content:"";position:absolute;left:7px;top:3.5px;width:5px;height:10px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
.sd.bad{background:var(--res);border-color:var(--res)}
.sd.bad:after{content:"!";position:absolute;inset:0;color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center}
.sd.run{border-color:var(--clean);border-top-color:transparent}
/* ---------- Jobs ---------- */
#jobs{display:grid;grid-template-columns:300px 1fr 400px;gap:var(--g2);height:100%}
.col{display:flex;flex-direction:column;gap:var(--g2);min-height:0}
.form{padding:var(--g1) var(--g2) var(--g2)}
.fl{font-size:12px;font-weight:600;color:var(--muted);margin:var(--g1) 0 6px}
.inp{border:1.5px solid var(--line);border-radius:9px;padding:7px 11px;font-size:14px;min-height:36px;background:#fff;display:flex;align-items:center;gap:8px}
.inp.ro{background:var(--sub);color:var(--ink)}
.inp .car{display:inline-block;width:1.5px;height:16px;background:var(--ink)}
.inp .chev{margin-left:auto;width:8px;height:8px;border:solid var(--muted);border-width:0 1.8px 1.8px 0;transform:rotate(45deg) translateY(-3px)}
.inp.focus,.inp:focus-within{border-color:var(--clean);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
.inp input,.inp select{border:0;outline:0;background:transparent;font:400 14px Manrope,sans-serif;color:var(--ink);flex:1;min-width:0;padding:0;appearance:none;-webkit-appearance:none}
.inp.sel{position:relative}.inp.sel .chev{position:absolute;right:12px;top:13px;pointer-events:none}
#jstart{width:100%;margin-top:var(--g2)}
.ctl{padding:var(--g1) var(--g2) var(--g2)}
.ctl .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--g0)}
.ctl button{padding:8px 0}
.appr{font-size:12px;color:var(--muted);margin-top:var(--g1)}
.cam{padding:var(--g1);position:relative}
.cam .hd,.zm .hd,.jc .hd{display:flex;align-items:center;gap:var(--g0);margin-bottom:var(--g0)}
.cam .hd .t,.zm .hd .t,.jc .hd .t{font-weight:600;font-size:14px}
.camv{position:relative;border-radius:9px;overflow:hidden;background:var(--sub);aspect-ratio:16/9}
.camv img{width:100%;height:100%;object-fit:cover;display:block}
.simtag{position:absolute;right:9px;bottom:7px;font-size:10.5px;color:rgba(110,110,110,.85);letter-spacing:.2px}
.zm{padding:var(--g1);display:flex;gap:var(--g1)}
.zmap{position:relative;width:280px;flex:none;align-self:flex-start;border-radius:8px;overflow:hidden;border:1px solid var(--line)}   /* not stretched by the stats card on the right (once stretched, aspect-ratio breaks and the grid would stick out of the reference image) */
.zmap img{width:100%;display:block}
.zg{position:absolute;inset:0;display:grid}
.zc2{border:1px solid rgba(255,255,255,0);position:relative}
.zc2 .lb{position:absolute;left:4px;top:2px;font-size:10px;font-weight:600;color:rgba(255,255,255,0)}
.zinfo{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:var(--g0);align-content:start}
.st{background:var(--sub);border-radius:9px;padding:7px 11px}.st b{display:block;font-size:18px}.st span{font-size:11px;color:var(--muted);font-weight:600}
.jc{padding:var(--g1);display:flex;flex-direction:column;min-height:0;flex:1}
#jlog{flex:1;min-height:0;overflow:hidden;position:relative}
#jlog.over{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26px);mask-image:linear-gradient(to bottom,transparent 0,#000 26px)}
#jlogi{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:7px}
.ev{border-left:3px solid var(--line);padding:3px 0 3px 10px}
.ev .w{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;margin-right:6px}
.ev .x{font-size:14px;font-weight:600}.ev .m{font-size:12px;color:var(--muted)}
.ev.check{border-color:var(--cos)}.ev.check .w{background:var(--cos-bg);color:var(--cos)}
.ev.plan{border-color:var(--nemo)}.ev.plan .w{background:var(--nemo-bg);color:var(--nemo)}
.ev.guard{border-color:var(--amber)}.ev.guard .w{background:var(--amber-bg);color:var(--amber)}
.ev.wipe{border-color:var(--slate)}.ev.wipe .w{background:var(--slate-bg);color:var(--slate)}
.ev.end{border-color:var(--clean)}.ev.end .w{background:var(--clean-bg);color:var(--clean)}
.ev.op{border-color:var(--ink)}.ev.op .w{background:var(--sub);color:var(--ink)}
.fdb{margin:4px 0 2px;background:var(--nemo-bg);border-radius:8px;padding:7px 9px;font-size:12px;color:var(--nemo)}
.fdb .chips{display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;margin-top:5px;height:42px;overflow:hidden}   /* fixed two-row height: the log below does not jump when screening changes phase */
.tailw{overflow:hidden;display:flex;flex-direction:column;gap:7px}
.fdb .chip{padding:1px 6px;border-radius:5px;background:#fff;color:#7d73c9;font-weight:600;font-size:11px;border:1px solid #d9d3f6}
.fdb .chip.hit{background:var(--nemo);color:#fff;border-color:var(--nemo)}
.req{padding:var(--g1);border-color:#d5dae1;background:#fbfbfc}
.req .t{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.req .r{font-size:13px;color:var(--ink);margin:6px 0 var(--g0)}
.req .row{display:flex;gap:var(--g0);align-items:center}
.req .inp{flex:1;min-height:34px;font-size:13px}
.req .done{color:var(--clean);font-weight:600;font-size:13px}
/* ---------- first-run wizard (Bambu Studio style small window) ---------- */
#wiz{position:absolute;left:250px;top:40px;width:1100px;height:666px;background:#fff;border:1px solid #d9d5cc;border-radius:14px;
  box-shadow:0 24px 60px rgba(29,36,51,.18),0 2px 6px rgba(29,36,51,.06);overflow:hidden;display:none;z-index:30}
#wiz .wb{position:absolute;left:0;right:0;top:96px;bottom:72px;padding:var(--g1) var(--g3)}
.wsteps{display:flex;gap:var(--g0);align-items:center;height:52px;padding:0 var(--g3);border-bottom:1px solid #f0ede7}
.wst{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;color:var(--faint)}
.wst .n{width:24px;height:24px;border-radius:50%;border:1.5px solid #d6d2c9;display:flex;align-items:center;justify-content:center;font-size:12px;background:#fff}
.wst.on{color:var(--ink)}.wst.on .n{border-color:var(--clean);color:var(--clean)}
.wst.done{color:var(--muted)}.wst.done .n{background:var(--clean);border-color:var(--clean);color:#fff}
.wsep{flex:0 0 34px;height:1.5px;background:#e2ded6}
.wpage{position:absolute;inset:0;padding:var(--g1) var(--g3);display:none}
.wh{font-size:22px;font-weight:600;letter-spacing:-.2px}.wsub{color:var(--muted);font-size:13px;margin:3px 0 var(--g2)}
#wgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--g1);margin-top:var(--g1)}
.wcard{border:1.5px solid var(--line);border-radius:12px;padding:var(--g0);position:relative;background:#fff}
.wcard .im{height:118px;display:flex;align-items:center;justify-content:center;background:#fff}
.wcard .im img{max-height:108px;max-width:92%;object-fit:contain}
.wcard .nm{font-weight:600;font-size:13px;text-align:center;margin-top:6px}.wcard .kd{font-size:11px;color:var(--muted);text-align:center}
.wcard.hover{border-color:#cfcac0;box-shadow:0 4px 14px rgba(29,36,51,.08)}
.wcard.sel{border-color:var(--clean);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
.wcard .ck{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--clean);display:none}
.wcard.sel .ck{display:block}.wcard .ck:after{content:"";position:absolute;left:7px;top:3.5px;width:5px;height:10px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
.wcard.dim{opacity:.25}
.wtwo{display:grid;grid-template-columns:380px 1fr;gap:var(--g3)}
.wrow{display:flex;gap:var(--g1);align-items:center;padding:var(--g1) 0;border-top:1px solid #f0ede7}
.wrow:first-child{border-top:0}
.wrow .ic{width:40px;height:40px;border-radius:10px;background:var(--sub);display:flex;align-items:center;justify-content:center;flex:none}
.wrow .ic img{width:34px;height:34px}.wrow .ic svg{width:22px;height:22px;stroke:var(--slate);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.wrow .tx{flex:1;min-width:0}.wrow .a{font-weight:600;font-size:14px}.wrow .b{color:var(--muted);font-size:12px;margin-top:2px}
.wthumb{width:132px;height:74px;border-radius:7px;object-fit:cover;flex:none;border:1px solid var(--line)}
.wfoot{position:absolute;left:0;right:0;bottom:0;height:72px;border-top:1px solid var(--line);display:flex;align-items:center;gap:var(--g1);padding:0 var(--g3);background:#fbfaf8}
.wtypes{display:flex;flex-wrap:wrap;gap:var(--g0);margin-bottom:var(--g1)}
.wty{padding:7px 14px;border-radius:10px;border:1.5px solid var(--line);font-weight:600;font-size:13px;color:var(--muted);background:#fff}
.wty.sel{border-color:var(--clean);color:var(--clean);background:var(--clean-bg)}.wty.hover{border-color:#cfcac0;color:var(--ink)}
.wref{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);width:100%}
.wref img{width:100%;display:block}
.wref .zg .zc2{border-color:rgba(255,255,255,0)}
.wcal{display:flex;align-items:center;gap:var(--g0);margin-top:var(--g1);font-weight:600;font-size:13px;color:var(--clean)}
.wlink{font-weight:600;font-size:13px;color:var(--muted)}.wlink.ok{color:var(--clean)}
.mz i{position:relative}.mz i b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:600;color:var(--faint);font-style:normal}
#rzclose{position:absolute;right:22px;top:22px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted);pointer-events:auto}
#japprove2{padding:var(--g1);border-color:#c9c2f2;background:#f7f5ff;display:none}
#japprove2 .t{font-weight:600;font-size:14px;color:var(--nemo)}#japprove2 .row{display:flex;gap:var(--g0);margin-top:var(--g0)}
/* ---------- Robots ---------- */
#rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--g1)}
.rc{padding:var(--g0);border:1.5px solid var(--line)}
.rc .im{border-radius:8px;overflow:hidden;background:#fff;height:88px;display:flex;align-items:center;justify-content:center}
.rc .im img{max-height:82px;max-width:90%;object-fit:contain;display:block}
.rc .nm{font-weight:600;font-size:15px;margin:var(--g0) 4px 0}.rc .sn{font-size:12px;color:var(--muted);margin:1px 4px 6px}
.rc .row{display:flex;gap:6px;margin:0 4px 4px}
.rc.hover{border-color:#cfcac0;box-shadow:0 4px 14px rgba(29,36,51,.08)}
.rc.sel{border-color:var(--clean);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
#rsup{}
#rsupg{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--g0)}
.mt{border:1px solid var(--line);border-radius:10px;padding:6px 6px 7px;text-align:center;font-size:12px;font-weight:600;background:#fff}
.mt .im{height:74px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.mt img{max-height:68px;max-width:88%;object-fit:contain}.mt .ad{color:var(--muted);font-weight:400;font-size:11px}
.mt.dim{opacity:.25}
.rhead{display:flex;align-items:center;gap:var(--g1);margin:var(--g1) 0 var(--g0)}
.rhead h3{margin:0}
#rlow{position:relative;margin-top:var(--g0)}
#rsup{}
#rdet{position:absolute;left:0;right:0;top:0;background:#fff;border:1px solid var(--line);border-radius:12px;display:none;padding:var(--g1);gap:var(--g2);height:100%;box-sizing:border-box}
#rdet .camv{height:100%;flex:none;aspect-ratio:16/9}
#rdet .side{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--g0)}
#rdet .side .t{font-weight:600;font-size:18px}
#rzoom{position:fixed;left:0;top:0;width:1600px;height:746px;display:none;pointer-events:none;z-index:40}   /* full-screen view (above the subtitle band) */
#rzoom .bg{position:absolute;inset:0;background:var(--paper)}
#rztabs{position:absolute;left:0;right:0;top:22px;display:flex;justify-content:center;gap:var(--g0)}
.rzt{padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;color:var(--muted)}
.rzt.on{background:var(--ink);color:#fff;border-color:var(--ink)}.rzt.hover{border-color:#cfcac0;color:var(--ink)}.rzt.on.hover{color:#fff;border-color:var(--ink)}
#rzoom .rzim{position:absolute;border-radius:14px;overflow:hidden;background:var(--sub);box-shadow:0 18px 50px rgba(30,30,30,.16)}
#rzoom .rzim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#rzoom .simtag{right:16px;bottom:12px;color:#5f6672;text-shadow:0 0 1px rgba(255,255,255,.95),0 0 2px rgba(255,255,255,.75)}   /* still visible on dark scenes (remains small text) */
.rzcap{position:absolute;left:14px;bottom:12px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.94);border-radius:10px;padding:7px 12px;font-size:14px}
.rzcap #rzs{color:var(--muted)}
#rdlogw{flex:1;min-height:0;margin-top:var(--g1);position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26px);mask-image:linear-gradient(to bottom,transparent 0,#000 26px)}
#rdlog{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:7px}   /* new entries at the bottom; during replay a new row expands and smoothly pushes old rows up, the top fades out */
/* ---------- Sites ---------- */
#sites{display:grid;grid-template-columns:330px 1fr;gap:var(--g2)}
.sl{padding:var(--g0)}
.si{display:flex;gap:var(--g1);align-items:center;padding:10px 12px;border-radius:10px;margin-bottom:4px}
.si img{width:62px;height:44px;object-fit:contain;flex:none;background:var(--sub);border-radius:6px}
.si .a{font-weight:600;font-size:14px}.si .b{font-size:12px;color:var(--muted)}
.si.on{background:var(--clean-bg)}.si.hover{background:#f3f1ec}
.sd2{padding:var(--g2)}
.sd2 .t{font-size:20px;font-weight:600}
.chips2{display:flex;flex-wrap:wrap;gap:var(--g0);margin:var(--g0) 0 var(--g2)}
.kv{display:inline-flex;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--sub);font-size:12px}.kv b{color:var(--muted);font-weight:600}
.sref{position:relative;width:560px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.sref img{width:100%;display:block}

async function wizGuidedStep(w, el) {
  const ci = D.wz && D.wz.site; if (!ci) return;

  if (step === "touch") body.marker = +el.dataset.marker;
  if (step === "zones") { const r = parseInt($("#wz-grows").value, 10), c = parseInt($("#wz-gcols").value, 10);
    w.grows = $("#wz-grows").value; w.gcols = $("#wz-gcols").value;
    if (!(r >= 1 && r <= 8 && c >= 1 && c <= 12)) { w.gErr = {step, msg: "Rows must be 1–8 and columns 1–12"}; setView(V); return; }
    body.rows = r; body.cols = c; }
  w.gBusy = step; w.gErr = null; setView(V);
  try { w.gstate = await postJ("/api/calibrate/step", body); }
  catch (e) { w.gErr = {step, msg: errText(e)}; }
  w.gBusy = null;
  const c2 = await api(`/api/setup/site?site=${encodeURIComponent(ci.site)}`).catch(() => null);   // after each step check whether the site is calibrated: if so collapse the steps and fade in the grid
  if (c2 && c2.calibrated && !c2.needs_sync && ((w.gstate && (w.gstate.steps || []).every(x => x.done)) || step === "sync")) {
    D.wz = {...(D.wz || {}), site: c2}; siteCalibrated(c2); built.site = null; w.gOpen = false; fadeCal(w); return; }
  setView(V);
}

      else { const e = D.settings.escalate; S.escalate = Math.round(e.min + u * (e.max - e.min)); } }
    if (id.startsWith("sch-pol-")) S.policy = el.dataset.v;                  // planning / inspection mode: takes effect only on Save after selecting (runtime.policy / runtime.verifier)
    if (id.startsWith("sch-ver-")) S.verifier = el.dataset.v;
    if (id === "stest") { if (D.tfBusy) return; D.tfBusy = true; setView(V);  // key: if the box is filled, save it first (PUT api_key, not echoed), then test Token Factory
      const key = ($("#skey") || {}).value ? $("#skey").value.trim() : "";
      try {
        if (key) { D.settings = await fullSettings(await api(settingsUrl(), {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({api_key: key})}));
          const ki = $("#skey"); if (ki) { ki.value = ""; ki.placeholder = "A key is saved · paste to replace"; } }
        const r = await post("/api/setup/models", {});
        const c = (r.checks || []).find(x => x.id === "tokenfactory");
        if (c) { D.tfTest = {ok: !!c.ok && !c.fallback, fallback: !!c.fallback, detail: c.detail || ""};
          D.settings.status.checks = {...(D.settings.status.checks || {}), tokenfactory: {ok: !!c.ok && !c.fallback, detail: c.detail}}; }
      } catch (e) { D.tfTest = {ok: false, detail: errText(e)}; const ki = $("#skey"); if (ki) ki.value = ""; }
      D.tfBusy = false; }
    if (id === "shooktest") { const r = await post("/api/settings/test-webhook?site=" + encodeURIComponent(D.meta.site)).catch(e => ({ok: false})); setPill("sv-hook", !!r.ok, r.ok ? "Test delivered" : "Test failed"); return; }
    if (id === "sruncheck") { if (D.runChk && D.runChk.busy) return; D.runChk = {busy: true}; setView(V);   // works for both deployments: a simulated deployment checks the local simulation, a paired deployment checks the robot computer
      try { const r = await api("/api/deploy/checks");
        D.settings.status = {source: "check", ts: r.ts, checks: Object.fromEntries(r.checks.map(c => [c.id, {ok: c.ok, detail: c.detail}]))};
        const R = D.settings.runtime || {}, unused = c => (c.id === "cosmos" && R.verifier !== "vlm") || (c.id === "tokenfactory" && R.policy !== "nemotron");   // services not needed by the current settings that are not up do not count as failures (same rule as the wizard Services step)
        const bad = r.checks.filter(c => !c.ok && !unused(c)), off = r.checks.filter(c => !c.ok && unused(c)), tm = new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});

      catch (e) { settingsToast(errText(e), true); return; }           // the server rejected it (e.g. switching to Nemotron without a key): red notice states the reason and the change is kept
      D.settings = await fullSettings(r).catch(() => D.settings);
      if (D.settings.runtime) D.meta.runtime = {...(D.meta.runtime || {}), policy: D.settings.runtime.policy, verifier: D.settings.runtime.verifier};
      D.tfTest = null; V.settings = {cat: S.cat, toast: 0}; buildSettings(); settingsToast("Saved · applies from the next job", false); pollLink(); }
    if (V.page === "settings") setView(V);

}
function settingsToast(msg, bad) {                                 // settings page save notice: 2.2 s on success, 4 s on error, then fades out over 0.3 s (same element and fields as the recording)
  const t = $("#toast"); t.textContent = msg; t.classList.toggle("bad", !!bad);
  const S = V.settings = V.settings || {}, me = (settingsToast.n = (settingsToast.n || 0) + 1), a0 = S.toast || 0;
  const step = x => { if (me !== settingsToast.n || V.settings !== S) return false;
    if (V.page !== "settings") { S.toast = 0; return false; }   // page changed midway: the notice is dismissed directly (nothing half-transparent left when coming back)
    S.toast = x; setView(V); };
  tween("stoast", a0, 1, 0.3 * (1 - a0), step).then(ok => { if (ok) setTimeout(() => { if (me === settingsToast.n) tween("stoast", 1, 0, 0.3, step); }, bad ? 4000 : 2200); });   // fade in over 0.3 s, hold, then fade out over 0.3 s
}
function toastIn() {                                             // human-handoff notification: same as the recording, fades in over 0.3 s and drops from 10 px above
  const to = $("#jtoast"); delete to.dataset.fading; to.style.display = "block"; const t0 = performance.now();
  const f = () => { if (to.dataset.fading) return; const u = clamp((performance.now() - t0) / 300); to.style.opacity = u;
    to.style.transform = `translateY(${((1 - ease(u)) * -10).toFixed(1)}px)`; if (u < 1) requestAnimationFrame(f); }; f();
}
function fadeToast() {                                          // live mode: the human-handoff notification fades out over 0.3 s (the same duration as in the recording)
  const to = $("#jtoast"); if (to.style.display === "none" || to.dataset.fading) return;
  to.dataset.fading = "1"; const t0 = performance.now();
  const f = () => { const u = clamp((performance.now() - t0) / 300); to.style.opacity = 1 - u;
    if (u < 1) requestAnimationFrame(f); else { to.style.display = "none"; delete to.dataset.fading; } }; f();
}
async function loadSiteCal(id) { D.wz = {...(D.wz || {}), site: await api(`/api/setup/site?site=${encodeURIComponent(id)}`).catch(() => null)};
  if (D.wz.site && D.wz.site.how) D.lastHow = D.wz.site.how; }
// live-mode transition animation: the same set of fields as the recording (scan / zA / fdb / tail / reqA), timed on the real clock:
// job creation → zone grid scan (thin lines fade in, at least 1.5 s) → first check result arrives: grid fades out over 0.5 s, dirty cells get a blue frame fading in over 0.3 s, the log shows the first check →
// force database screening (all entries → by surface → hit, about 3 s; the log stays at the check entry meanwhile) → later entries such as plan and guardrails expand and fade in → the human-handoff card expands over 0.45 s when opened.
// the state on screen "plays out" the real backend events along this timeline, without changing or making up any data.
const FX0 = {n: 0, seen: false, stopping: false, run0: null, res0: null, fdb0: null, stain: null, tail0: null, tailN: 0, reqShow: false, req0: null, ended: null};
// sess = started_at of the current job (given by the server); waiting / waitOld: Start was clicked and the state of the new job has not arrived (drop the late state of the old job); hide: the job no longer shown after a site change
const FX = {st: null, raf: false, camT: 0, site: null, sess: null, waiting: false, waitOld: null, hide: null, ...FX0};
const nowS = () => performance.now() / 1000;
const SCAN_MIN = 1.5, FDB_LEN = 2.65, SCAN_LEN = 3.5;          // screening starts collapsing at 2.25 s and finishes at 2.65 s; the grid lights up from 0.3 and reaches 1 at 3.5 s
function scanAt(t) { return FX.run0 == null ? 0 : 0.3 + 0.7 * clamp((t - FX.run0) / SCAN_LEN); }   // recording job_sim: 0.3 + 0.7 · progress
function resT() { return FX.res0 == null ? null : Math.max(FX.res0, (FX.run0 ?? FX.res0) + SCAN_MIN); }   // the moment the result is "revealed" (scanning runs at least SCAN_MIN)
function liveView() {
  const t = nowS(), st = FX.st, log = st.log || [], T = resT();

  } else {
    j.scan = scanAt(T) * clamp(1 - (t - T) / 0.5); j.zA = clamp((t - T) / 0.3);   // result arrived: fade out from the brightness at that time (do not jump to 1 first)
    if (FX.fdb0 != null && t < FX.fdb0 + FDB_LEN) {                  // screening: the log stays before the plan (a plan awaiting approval also waits until the screening has played)
      if (iPlan >= 0) shown = log.slice(0, iPlan);
      j.holdApprove = true;
      const u = t - FX.fdb0;
      if (u >= 0) j.fdb = {stain: FX.stain, u: clamp(u / 1.8), a: u < 2.25 ? clamp(u / 0.3) : clamp(1 - (u - 2.25) / 0.15), h: u < 2.25 ? ease(u / 0.25) : 1 - ease((u - 2.4) / 0.25)};
    } else if (FX.fdb0 == null && iPlan >= 0) { shown = log.slice(0, iPlan); j.holdApprove = true; }   // plan has arrived and screening has not started (liveTick schedules it right away)
  }
  if (shown.length > FX.n && (FX.n > 0 || FX.seen)) { FX.tail0 = t; FX.tailN = shown.length - FX.n; }   // the first entry of a new job also expands and fades in

  if (FX.req0 != null) j.reqA = ease((t - FX.req0) / 0.45);

}
function liveJob() { return liveView().j; }
function fxActive() { const t = nowS(), T = resT();
  return (FX.run0 != null && (T == null || t < T + 0.6)) || (FX.fdb0 != null && t < FX.fdb0 + FDB_LEN + 0.1) || (FX.tail0 != null && t - FX.tail0 < 0.45) || (FX.req0 != null && t - FX.req0 < 0.5); }
async function renderLive() { if (V.page !== "jobs" || !FX.st || (V.wiz && V.wiz.a > 0)) { FX.raf = false; return; }
  const {j, view} = liveView(); await renderJob(j, view); if (fxActive()) requestAnimationFrame(renderLive); else FX.raf = false; }
function kick() { if (!FX.raf) { FX.raf = true; requestAnimationFrame(renderLive); } }
async function refreshAfterJob() {                             // a job ended: reports, Today history, logs, spending and the Robots page are all refreshed (no need to reopen the software)
  const r = await api("/api/reports").catch(() => null); if (r) D.reports = r.reports;
  const lg = await api("/api/logs/models?limit=400").catch(() => null); if (lg) { D.calls = lg.calls; D.spent = lg.spent_usd ?? D.spent; }
  buildLogs(); buildReports(); buildRobots();
  if (["robots", "logs", "reports"].includes(V.page) && !(V.wiz && V.wiz.a > 0)) setView(V);   // the page being viewed is redrawn right after rebuilding (also when the Robots full-screen view is open)
}
const isWipePlan = e => e.kind === "plan" && (e.action == null || e.action === "wipe_zone" || e.action === "spot_scrub");
function liveReset() { Object.assign(FX, FX0, {run0: nowS(), seen: true}); }   // new job: start from scanning, the first log entry also expands
async function liveTick() {
  if (!D.meta.job && !(V.wiz && V.wiz.a > 0)) {
    const st = await api("/api/jobs/state").catch(() => ({status: "idle"}));
    V.live = st.live;
    const sa = st.live ? st.live.started_at : null;
    if (FX.waiting) { if (sa == null || sa === FX.waitOld) st.status = "stale"; else { FX.waiting = false; FX.sess = sa; } }   // the state of the new job has not arrived
    if (st.status !== "stale" && st.status !== "idle" && !(FX.hide != null && sa === FX.hide)) {
      FX.hide = null;
      const t = nowS(), zs = st.zones || {}, log = st.log || [];
      if (FX.sess == null) {                                         // a job already exists when the software is opened (running or ended): show the current state directly, without replaying scanning and screening
        FX.sess = sa; Object.assign(FX, FX0, {run0: t - 10, res0: Object.values(zs).some(z => z.status) ? t - 10 : null,
          fdb0: log.some(isWipePlan) ? t - 10 - FDB_LEN : null});
      } else if (sa != null && sa !== FX.sess) { FX.sess = sa; liveReset(); }   // a new job started elsewhere
      if (FX.res0 == null && (Object.values(zs).some(z => z.status) || st.status !== "running")) FX.res0 = t;   // ended without a check result (e-stop / error): scanning also collapses
      const plan = log.find(isWipePlan);
      if (FX.fdb0 == null && plan && !plan.lookup && FX.res0 != null) { FX.fdb0 = Math.max(t, resT() + 0.35);
        const pz = (plan.zones || [])[0], dz = (pz && zs[pz]) || Object.values(zs).find(z => z.status === "residue" || z.status === "uncertain");
        FX.stain = (dz && dz.stain_type) || "unknown"; }
      if (st.status === "error" && st.live && st.live.error)
        st.log = [...log, {who: "Software", kind: "guard", ok: false, text: "job stopped: " + String(st.live.error).split("\n")[0].slice(0, 120), meta: "see the server log"}];

      if (V.page === "jobs") { const {j, view} = liveView(); await renderJob(j, view); kick(); $("#jpause").textContent = st.live && st.live.paused ? "Resume" : "Pause"; }

}
function camTick() {                                           // live camera frame at 5 frames / s (rendered at the same rate in the simulation thread, see session.LiveSession._attach_view)
  if (liveMode && !D.meta.job && V.page === "jobs" && FX.st && FX.st.status === "running" && !FX.waiting && !(V.wiz && V.wiz.a > 0)
      && performance.now() - (FX.camT || 0) > 180 && !$("#jcam").dataset.busy) { FX.camT = performance.now(); setImg($("#jcam"), `/api/jobs/frame?t=${Date.now()}`); }
  if (liveMode && V.page === "robots" && V.robots && V.robots.sel && !(V.wiz && V.wiz.a > 0) && performance.now() - (FX.rzT || 0) > 500 && !$("#rzimg").dataset.busy) {
    FX.rzT = performance.now(); renderRobots(V.robots); }                // Robots page full-screen view: the image follows while a job runs at this site
  setTimeout(camTick, 200);

// desktop edition (?app=1): the window holds only the software window, scaled proportionally to the window size; the title bar drags the window, and the dots are window buttons (js_api of pywebview)
const APP = /[?&]app=1/.test(location.search);
// the software window (1568 × 718) scales in proportion to the browser / desktop window and is centred: when the window is smaller than the design size the whole thing shrinks instead of cutting off the right and bottom
function fitApp() { const k = Math.min(innerWidth / 1568, innerHeight / 718), ox = (innerWidth - 1568 * k) / 2, oy = (innerHeight - 718 * k) / 2;
  $("#desk").style.transform = `translate(${ox.toFixed(2)}px,${oy.toFixed(2)}px) scale(${k.toFixed(4)}) translate(-16px,-14px)`; }
function wireApp() {
  document.body.classList.add("app"); addEventListener("resize", fitApp); fitApp();
  $$(".tbar").forEach(t => t.classList.add("pywebview-drag-region"));
  document.addEventListener("click", ev => { const i = ev.target.closest(".dots i"); if (!i || !window.pywebview || !window.pywebview.api) return;
    const k = [...i.parentNode.children].indexOf(i), a = window.pywebview.api; (k === 0 ? a.close : k === 1 ? a.minimize : a.toggle_maximize)(); });
}

// config error / startup failure: one banner over the whole page (which file, which line, what is wrong), no blank page; when a site other than the current one has errors, only a hint at the top
function configBanner(errs, blocking, msg) {
  const rows = (errs || []).slice(0, 6).map(e => `<li><b>${esc(e.file)}</b>${e.line ? `, line ${e.line}` : ""}: ${esc(e.message)}</li>`).join("");
  const el = document.createElement("div"); el.id = "cfgbanner";
  el.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99;background:#fff4e5;color:#7a3e00;border-bottom:1px solid #f0c48a;padding:10px 16px;font:13px/1.45 system-ui,sans-serif;" +
    (blocking ? "bottom:0;overflow:auto;padding:40px 16px;border:0" : "");
  el.innerHTML = `<b>${blocking ? "CleanProof cannot start with this configuration." : "A site configuration file has a problem."}</b> ${esc(msg || "")}<ul style="margin:6px 0 0 18px">${rows}</ul>` +
    `<div style="margin-top:6px">Fix the file, then ${blocking ? "reload this page" : "reload to bring the site back"}.${blocking ? "" : ' <a href="#" id="cfgx">Dismiss</a>'}</div>`;

}
async function boot() {
  try { await boot0(); } catch (e) {
    const cfg = e && e.cfg; configBanner(cfg, true, cfg ? "" : errText(e)); }
}
async function boot0() {
